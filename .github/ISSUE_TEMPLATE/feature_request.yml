name: Feature request
description: An idea that would make your reels better or faster to make.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: footage
    attributes:
      label: Detection ideas
      description: If it's about finding moments, what camera and footage it's for, and labelled times if you have them.
